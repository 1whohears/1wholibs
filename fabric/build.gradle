plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    mods {
        fabric {
            sourceSet project(":fabric").sourceSets.main
        }
    }
    runs {
        client2 {
            inherit client
            name 'runClient2'
            programArgs '--username=ManiacalMonkey'
        }
        client3 {
            inherit client
            name 'runClient3'
            programArgs '--username=LunaticDonkey'
        }
        client4 {
            inherit client
            name 'runClient4'
            programArgs '--username=ShitAss'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

configurations.configureEach {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}")
    }
}

dependencies {
    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle common(project(path: ':common', configuration: 'shadowedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    modCompileOnly "curse.maven:open-parties-and-claims-636608:${rootProject.fabric_openpartiesandclaims_id}"
    modCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forgeconfigapiport_version}"
}

processResources {
    from(project(":common").file("src/main/resources/onewholibs.accesswidener"))

    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                homepage: project.findProperty("homepage"),
                mod_authors: project.findProperty("mod_authors"),
                issue_tracker: project.findProperty("issue_tracker"),
                mod_description: project.findProperty("mod_description"),
                minecraft_version: project.findProperty("minecraft_version"),
                fabric_loader_version: project.findProperty("fabric_loader_version"),
                fabric_api_version: project.findProperty("fabric_api_version"),
                ftb_library_version: project.findProperty("ftb_library_version"),
                ftb_teams_version: project.findProperty("ftb_teams_version"),
                architectury_version: project.findProperty("architectury_version"),
                openpartiesandclaims_version: project.findProperty("openpartiesandclaims_version"),
                forgeconfigapiport_version: project.findProperty("forgeconfigapiport_version")
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'META-INF/maven/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}
