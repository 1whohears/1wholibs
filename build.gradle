plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        maven {
            url "https://maven.ftb.dev/releases"
            content {
                includeGroup "dev.ftb.mods"
            }
        }
        maven {
            url "https://cursemaven.com"
        }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            name = "FelNull Maven"
            url = "https://maven.felnull.dev"
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    // FIXME - Good chance this isn't publishing properly
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                artifact jar
            }
        }

        File localPropertiesFile = new File("$projectDir/local.properties")

        if (localPropertiesFile.exists()) {
            Properties props = new Properties()
            props.load(new FileInputStream(localPropertiesFile))

            repositories {
                maven {
                    credentials {
                        username = props.repsyMavenUsername
                        password = props.repsyMavenPassword
                    }
                    url "https://repo.repsy.io/mvn/1whohears/1wholibs"
                }
            }
        } else {
            logger.lifecycle("Skipping repository configuration: local.properties not found.")
        }
    }
}
